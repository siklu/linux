name: Build Linux Kernel (siklu_arm64_defconfig)

on:
  workflow_dispatch:
  push:
    branches:
      - tg-v6.12
  pull_request:
    branches:
      - tg-v6.12

jobs:
  build:
      runs-on: ubuntu-latest
      env:
        ARCH: arm64
        CROSS_COMPILE: aarch64-linux-gnu-
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libncurses-dev crossbuild-essential-arm64 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Copy siklu_arm64_defconfig to config
        run: cp arch/arm64/configs/siklu_arm64_defconfig ./config

      - name: Configure kernel (olddefconfig)
        run: make ARCH=arm64 olddefconfig

      - name: Log runner CPU info
        run: |
          echo "CPU core count: $(nproc)"
          echo "Processor info:"
          lscpu

      - name: Build kernel with arm64 architecture
        run: make -j
      
      - name: Archive kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: arch/arm64/boot/Image
